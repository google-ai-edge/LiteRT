[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litert-quantizer"
description = "A quantizer for advanced developers to quantize converted AI Edge models."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["On-Device ML", "AI", "Google", "TFLite", "Quantization", "LLMs", "GenAI"]
dependencies = [
    "absl-py",
    "immutabledict",
    "numpy",
    "scipy",
    "ml_dtypes",
    "ai-edge-litert-nightly",
    "litert-lm-builder",
]

[project.urls]
Homepage = "https://github.com/google-ai-edge/LiteRT/tree/main/litert_quantizer"

[project.scripts]
litert-quantizer = "litert_quantizer.litert_quantizer:cli_main"

[dependency-groups]
dev = [
    "build",
    "colorama",
    "isort",
    "parameterized",
    "pyink",
    "pytest",
    "pytest-xdist",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
include = ["litert_quantizer*"]

[tool.setuptools.package-data]
"litert_quantizer" = ["recipes/*.json", "policies/*.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -n auto --dist loadfile"
