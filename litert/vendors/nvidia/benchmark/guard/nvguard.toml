# nvguard's defaults: the models, the numerics probe prompts, the performance
# workloads and the verdict thresholds. --config FILE replaces this file.

models = ["e2b", "e4b", "12b", "26b"]

# Numerics probes: a prompt decoded greedily for max_output_tokens inside a
# context of `context` tokens; the dispatch records the top-K logits of every
# step. Tiers are cumulative: quick < standard < long.
[[prompts]]
name = "code_grid"
file = "prompts/code_grid.txt"
max_output_tokens = 256
context = 2048

[[prompts]]
name = "code_stdin"
file = "prompts/code_stdin.txt"
max_output_tokens = 256
context = 2048

[[prompts]]
name = "code_class"
file = "prompts/code_class.txt"
max_output_tokens = 256
context = 2048

[[prompts]]
name = "reason"
file = "prompts/reason.txt"
max_output_tokens = 128
context = 2048

# The benchmark's own long documents: the attention kernels change with the
# sequence length (chunking, INT8 cache paths), so the long contexts count.
[[prompts]]
name = "doc_8k"
file = "../prompts/prompt_8k.txt"
max_output_tokens = 64
context = 9216

[[prompts]]
name = "doc_30k"
file = "../prompts/prompt_30k.txt"
max_output_tokens = 64
context = 31744
tier = "standard"

[[prompts]]
name = "doc_128k"
file = "../prompts/prompt_128k.txt"
max_output_tokens = 32
context = 130048
tier = "long"
models = ["12b"]

[numerics]
top_k = 32

# BF16 logits move by 0.125 per ulp; a different summation order moves the
# top logits one to three ulp per step and more along the sequence, with KL
# spikes at near-ties, so the regression signals are the KL over the first
# steps (identical inputs; about 1e-5 for a reorder), an early parting of the
# greedy text, loops and non-finite values. The rest warns.
[numerics.thresholds]
warn_max_abs_delta = 1.0
fail_max_abs_delta = 8.0
first_steps = 4
warn_first_kl = 1e-3
fail_first_kl = 1e-2
warn_mean_kl = 1e-3
fail_mean_kl = 1e-1
warn_min_overlap = 0.95
fail_min_overlap = 0.8
fail_diverge_before = 8
fail_loopiness = 0.25

# Performance probes: bench.sh latency runs of these workloads (synthetic
# prompt, 256 decode tokens); the cost models fitted on them predict the rest.
# Three contexts: the third lets the prefill model fit the attention's growth
# (two contexts leave long-context predictions 10-50% optimistic).
[perf]
workloads = ["short", "8k", "16k"]
predict = ["30k", "128k"]

[perf.iterations]
short = 5
8k = 3
16k = 3

[perf.thresholds]
warn_ratio = 0.97
fail_ratio = 0.93
