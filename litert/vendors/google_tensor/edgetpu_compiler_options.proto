syntax = "proto3";

package litert.google_tensor;

option java_multiple_files = true;
option java_package = "com.google.litert.googletensor";
option java_outer_classname = "EdgeTpuCompilerOptionsProto";

// Options for compiling a model using the EdgeTPU on-device compiler.
//
// Only the subset of `GoogleTensorOptions` that applies to single-buffer
// on-device compilation is carried here. Host-only filesystem and debug knobs
// are intentionally excluded.
// Next ID: 8
message EdgeTpuCompilerOptions {
  // Type of float truncation to apply during compilation. Mirrors
  // `GoogleTensorOptionsTruncationType` in `google_tensor_options.proto`.
  enum FloatTruncationType {
    FLOAT_TRUNCATION_TYPE_AUTO = 0;
    FLOAT_TRUNCATION_TYPE_NO_TRUNCATION = 1;
    FLOAT_TRUNCATION_TYPE_BFLOAT16 = 2;
    FLOAT_TRUNCATION_TYPE_HALF = 3;
  }

  // Sharding intensity, trading compile time and memory for runtime
  // performance. Mirrors `GoogleTensorOptionsShardingIntensity` in
  // `google_tensor_options.proto`.
  enum ShardingIntensity {
    SHARDING_INTENSITY_UNSPECIFIED = 0;
    SHARDING_INTENSITY_MINIMAL = 1;
    SHARDING_INTENSITY_MODERATE = 2;
    SHARDING_INTENSITY_EXTENSIVE = 3;
    SHARDING_INTENSITY_MAXIMUM = 4;
  }

  // Internal options for the EdgeTPU ODC compiler.
  bytes internal_options = 1;

  // The version of LiteRT in format `<major>.<minor>.<patch>`.
  string litert_version = 2;

  // Type of float truncation to apply.
  FloatTruncationType float_truncation_type = 3;

  // Whether to truncate int64 types to int32.
  bool int64_to_int32_truncation = 4;

  // Desired sharding intensity.
  ShardingIntensity sharding_intensity = 5;

  // Enables compilation support for 4-bit hybrid operations.
  bool enable_four_bit_compilation = 6;

  // Enables dynamic range quantization.
  bool enable_dynamic_range_quantization = 7;
}
