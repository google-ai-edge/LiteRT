# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#
# This workflow is triggered manually to
# 1. Run unit tests against the pinned ai-edge-litert version
# 2. Build the stable Python wheel and test installing it
# 3. Upload to PyPI, unless dry_run is set
# 4. Test installing the published version from PyPI

name: LiteRT Quantizer Build and Release (stable)

on:
  workflow_dispatch:  # Allow manual triggers for stable releases
    inputs:
      dry_run:
        description: 'When true, the package will not be published to PyPI.'
        required: true
        default: true
        type: boolean
      litert_version:
        description: 'The ai-edge-litert version to pin as a dependency, e.g. 2.2.0.'
        required: true
        type: string

permissions:
  contents: read

env:
  LITERT_VERSION: ${{ inputs.litert_version }}

jobs:
  run-unittests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    name: Run Unit Tests with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: litert_quantizer

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: litert_quantizer

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Pin ai-edge-litert
        run: |
          sed -i "s/\"ai-edge-litert[^\"]*\"/\"ai-edge-litert==${LITERT_VERSION}\"/" pyproject.toml
          grep -qF "\"ai-edge-litert==${LITERT_VERSION}\"" pyproject.toml

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  build-stable:
    needs: run-unittests
    name: Build Stable Python Wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    defaults:
      run:
        working-directory: litert_quantizer

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: litert_quantizer

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python
        run: uv python install

      - name: Pin ai-edge-litert
        id: metadata
        run: |
          sed -i "s/\"ai-edge-litert[^\"]*\"/\"ai-edge-litert==${LITERT_VERSION}\"/" pyproject.toml
          grep -qF "\"ai-edge-litert==${LITERT_VERSION}\"" pyproject.toml
          echo "version=$(cat VERSION | xargs)" >> "$GITHUB_OUTPUT"

          echo "Building litert-quantizer version $(cat VERSION) with ai-edge-litert==${LITERT_VERSION}"

      - name: Build Stable Package
        run: |
          uv build

      - name: Upload Stable Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: litert-quantizer-dist
          path: litert_quantizer/dist/

  test-before-publish:
    needs: build-stable
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    name: Test Install and Import Built litert-quantizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Download Stable Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: litert-quantizer-dist
          path: dist

      - name: Install litert-quantizer
        run: |
          python -m pip install dist/*.whl

      - name: Import litert-quantizer
        run: |
          python -c "import litert_quantizer"
          litert-quantizer --help

  publish-stable:
    needs: test-before-publish
    if: success() && inputs.dry_run == false
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Download Stable Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: litert-quantizer-dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Nothing to cache: this job only uploads the built package.
          enable-cache: false

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_UPLOAD_TOKEN }}
        run: uv publish

  test-after-publish:
    needs: [build-stable, publish-stable]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    name: Test Install and Import litert-quantizer from PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Install litert-quantizer
        env:
          VERSION: ${{ needs.build-stable.outputs.version }}
        run: |
          # Look up the wheel via the per-version JSON API instead of
          # `pip install ...==${VERSION}`: PyPI's CDN can keep serving a stale
          # project index after an upload, but this URL didn't exist before
          # the upload, so it can't be stale.
          WHEEL_URL=$(curl -fsSL --retry 5 --retry-delay 60 --retry-all-errors \
            "https://pypi.org/pypi/litert-quantizer/${VERSION}/json" \
            | python -c 'import json, sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "bdist_wheel"))')
          python -m pip install "litert-quantizer @ ${WHEEL_URL}"

      - name: Import litert-quantizer
        run: |
          python -c "import litert_quantizer"
          litert-quantizer --help
