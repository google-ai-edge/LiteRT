name: "windows_nightly_wheel"
on:
  schedule:
    - cron: '0 20 * * *'
      timezone: 'America/Los_Angeles'

  workflow_dispatch: {} # Allow manual trigger

permissions:
  contents: read

jobs:
  build-nightly:
    name: "Build nightly Windows wheel - Python ${{ matrix.python-version }}"
    runs-on: windows-x86-n2-16
    outputs:
      date: ${{ steps.nightly-date.outputs.date }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Clear ANDROID_NDK_HOME as windows-latest has NDK where jobs don't have permission for
      # androidndk rulesto create symlinks.
      ANDROID_NDK_HOME:
      LITERT_MODELS: ""
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add GNU tar to PATH
        shell: bash
        run: echo "C:/Program Files/Git/usr/bin" >> $GITHUB_PATH

      - name: Mount Bazel
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python-build and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel
          python -m pip list

      - name: Set USE_BAZEL_VERSION
        run: |
          if (Test-Path .bazelversion) {
            $version = Get-Content .bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          } elseif (Test-Path bazelversion) {
            $version = Get-Content bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          }

      - name: Set NIGHTLY_RELEASE_DATE
        id: nightly-date
        run: |
          $date = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([System.DateTime]::UtcNow, 'Pacific Standard Time').ToString('yyyyMMdd')
          echo "NIGHTLY_RELEASE_DATE=$date" >> $env:GITHUB_ENV
          echo "date=$date" >> $env:GITHUB_OUTPUT

      - name: Configure tensorflow & python path
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          $env:PYTHON_BIN_PATH = (Get-Command python).Source
          $env:PYTHON_LIB_PATH = (python -c 'import site; print(site.getsitepackages()[0])')
          $env:TF_NEED_ROCM = 0
          $env:TF_NEED_CUDA = 0
          $env:TF_SET_ANDROID_WORKSPACE = 0
          $env:CC_OPT_FLAGS = '/arch:AVX'
          echo "HERMETIC_PYTHON_VERSION=$env:PYTHON_VERSION" >> $env:GITHUB_ENV
          python configure.py

      - name : Set up cache keys and bazel output base.
        id: cache-keys
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          WORKSPACE_HASH: ${{ hashFiles('**/WORKSPACE', '**/.bazelrc') }}
          BUILD_HASH: ${{ hashFiles('**/BUILD*') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $CACHE_RESTORE_KEY_2="$env:WORKFLOW_NAME-$env:PYTHON_VERSION"
          $CACHE_RESTORE_KEY_1="$CACHE_RESTORE_KEY_2-$env:WORKSPACE_HASH"
          $CACHE_RESTORE_KEY_0="$CACHE_RESTORE_KEY_1-$env:BUILD_HASH"
          # If it's not a pull request, then it will be the same as $CACHE_RESTORE_KEY_1-.
          $CACHE_RESTORE_KEY_HEAD="$CACHE_RESTORE_KEY_0-$env:BASE_SHA"
          $CACHE_KEY="$CACHE_RESTORE_KEY_0-$env:HEAD_SHA"
          echo "CACHE_RESTORE_KEY_2=$CACHE_RESTORE_KEY_2" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=$CACHE_RESTORE_KEY_1" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=$CACHE_RESTORE_KEY_0" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_HEAD=$CACHE_RESTORE_KEY_HEAD" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$env:GITHUB_OUTPUT"
          # D: is faster than C: for I/O, but self-hosted runners only have C:.
          echo "BAZEL_OUTPUT_USER_ROOT=C:/.cache/bazel" >> "$env:GITHUB_ENV"


      - name: Clean build outputs if cache is being refreshed.
        if: env.REFRESH_CACHE == 'true'
        run: bazel --output_user_root="$env:BAZEL_OUTPUT_USER_ROOT" clean --expunge

      - name: Restore bazel cache if cache is not being refreshed.
        id: bazel-cache
        if: env.REFRESH_CACHE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          windir: ""
          PATH: "C:/Program Files/Git/usr/bin;C:/Windows/System32;C:/Windows"
        with:
          path: ~/.cache/bazel-windows
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_HEAD }}
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_0 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_1 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_2 }}-

      - name: Check cache hit
        env:
          CACHE_HIT: ${{ steps.bazel-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.bazel-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}
        run: |
          echo "Cache Hit: $env:CACHE_HIT"
          echo "Cache Primary Key: $env:CACHE_PRIMARY_KEY"
          echo "Cache Matched Key: $env:CACHE_MATCHED_KEY"

      - name: Set BAZEL_CONFIG_FLAGS for Cache
        run: |
          $CacheDir = Join-Path $env:USERPROFILE (Join-Path ".cache" "bazel-windows")
          echo "BAZEL_CONFIG_FLAGS=--disk_cache=$CacheDir" >> $env:GITHUB_ENV

      - name: Build LiteRT wheel for Windows
        run: |
          .\ci\build_pip_package_with_bazel_windows.ps1

      - name: Verify the distribution
        run: twine check --strict dist/*

      - name: List the contents of ai-edge-litert wheel
        run: Get-ChildItem dist -Filter *.whl | ForEach-Object { python -m zipfile --list $_.FullName }

      - name: Install local wheel
        run: Get-ChildItem dist -Filter *.whl | ForEach-Object { python -m pip install $_.FullName }

      - name: Import ai_edge_litert
        run: |
          python -c "import ai_edge_litert"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-edge-litert-windows-${{ matrix.python-version }}
          path: dist/*.whl

      - name: Build Windows x86_64 prebuilts
        id: build-prebuilts
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: .\ci\build_pip_package_with_bazel_windows.ps1 -Mode prebuilts

      - name: Upload prebuilts artifact
        if: matrix.python-version == '3.12' && steps.build-prebuilts.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: litert-prebuilts-windows-x86_64
          path: dist/litert_prebuilts_windows_x86_64.zip

      - name: Shutdown bazel server before saving cache.
        if: always()
        run: bazel --output_user_root="$env:BAZEL_OUTPUT_USER_ROOT" shutdown

      - name: Save bazel cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always()
        env:
          windir: ""
          PATH: "C:/Program Files/Git/usr/bin;C:/Windows/System32;C:/Windows"
        with:
          path: ~/.cache/bazel-windows
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}

  # Cross-compiles win_arm64 wheels on the x86_64 runner with MSVC. No Python
  # 3.10: CPython has no Windows ARM64 build before 3.11.
  build-nightly-arm64:
    name: "Build nightly Windows ARM64 wheel - Python ${{ matrix.python-version }}"
    runs-on: windows-x86-n2-16
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Clear ANDROID_NDK_HOME as windows-latest has NDK where jobs don't have permission for
      # androidndk rulesto create symlinks.
      ANDROID_NDK_HOME:
      LITERT_MODELS: ""
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add GNU tar to PATH
        shell: bash
        run: |
          echo "C:/Program Files/Git/usr/bin" >> $GITHUB_PATH
          echo "C:/tools/msys64/usr/bin" >> $GITHUB_PATH

      - name: Mount Bazel
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python-build and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel
          python -m pip list

      - name: Set up Windows ARM64 cross-compilation toolchain
        run: |
          .\ci\setup_windows_arm64_toolchain.ps1

      - name: Set USE_BAZEL_VERSION
        run: |
          if (Test-Path .bazelversion) {
            $version = Get-Content .bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          } elseif (Test-Path bazelversion) {
            $version = Get-Content bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          }

      - name: Set NIGHTLY_RELEASE_DATE
        run: |
          $date = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([System.DateTime]::UtcNow, 'Pacific Standard Time').ToString('yyyyMMdd')
          echo "NIGHTLY_RELEASE_DATE=$date" >> $env:GITHUB_ENV

      - name: Configure tensorflow & python path
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          $env:PYTHON_BIN_PATH = (Get-Command python).Source
          $env:PYTHON_LIB_PATH = (python -c 'import site; print(site.getsitepackages()[0])')
          $env:TF_NEED_CLANG = 0
          $env:TF_NEED_ROCM = 0
          $env:TF_NEED_CUDA = 0
          $env:TF_SET_ANDROID_WORKSPACE = 0
          $env:CC_OPT_FLAGS = '-Wno-sign-compare'
          echo "HERMETIC_PYTHON_VERSION=$env:PYTHON_VERSION" >> $env:GITHUB_ENV
          python configure.py

      - name : Set up QAIRT cache key and bazel output base.
        id: cache-keys
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          QAIRT_HASH: ${{ hashFiles('third_party/qairt/workspace.bzl') }}
        run: |
          echo "QAIRT_CACHE_KEY=$env:WORKFLOW_NAME-qairt-v1-$env:QAIRT_HASH" >> "$env:GITHUB_OUTPUT"
          # D: is faster than C: for I/O, but self-hosted runners only have C:.
          echo "BAZEL_OUTPUT_USER_ROOT=C:/.cache/bazel-arm64" >> "$env:GITHUB_ENV"

      - name: Restore and save QAIRT headers cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          windir: ""
          PATH: "C:/Program Files/Git/usr/bin;C:/tools/msys64/usr/bin;C:/Windows/System32;C:/Windows"
        with:
          path: C:/t/qairt_sdk
          key: ${{ steps.cache-keys.outputs.QAIRT_CACHE_KEY }}

      - name: Cross-build LiteRT wheel for Windows ARM64
        run: |
          .\ci\build_pip_package_with_bazel_windows.ps1 -TargetArch arm64

      - name: Verify the distribution
        run: twine check --strict dist/*

      - name: List the contents of ai-edge-litert wheel
        run: Get-ChildItem dist -Filter *.whl | ForEach-Object { python -m zipfile --list $_.FullName }

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-edge-litert-windows-arm64-${{ matrix.python-version }}
          path: dist/*.whl

      - name: Build Windows ARM64 prebuilts
        id: build-prebuilts
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: .\ci\build_pip_package_with_bazel_windows.ps1 -TargetArch arm64 -Mode prebuilts

      - name: Upload prebuilts artifact
        if: matrix.python-version == '3.12' && steps.build-prebuilts.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: litert-prebuilts-windows-arm64
          path: dist/litert_prebuilts_windows_arm64.zip

      - name: Shutdown bazel server
        if: always() && env.BAZEL_OUTPUT_USER_ROOT != ''
        run: |
          if ($env:BAZEL_OUTPUT_USER_ROOT -and (Test-Path $env:BAZEL_OUTPUT_USER_ROOT)) {
            bazel --output_user_root="$env:BAZEL_OUTPUT_USER_ROOT" shutdown
          }

  upload-prebuilts-to-gcs:
    name: "Upload Windows prebuilts to GCS"
    # Self-hosted GKE ARC runner with ambient Workload Identity.
    runs-on: linux-x86-n4-16
    needs: [build-nightly, build-nightly-arm64]
    if: ${{ !cancelled() && needs.build-nightly.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - name: Download prebuilts artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: litert-prebuilts-windows-*
          path: prebuilts
          merge-multiple: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@98ddc00a17442e89a24bbf282954a3b65ce6d200 # v2.1.0

      - name: Upload to gs://litert/binaries/nightly
        env:
          NIGHTLY_DATE: ${{ needs.build-nightly.outputs.date }}
        run: |
          [[ "${NIGHTLY_DATE}" =~ ^[0-9]{8}$ ]] || { echo "Bad date: ${NIGHTLY_DATE}"; exit 1; }
          # Publish whichever archives were built, but fail the job if either
          # arch is missing so a stale nightly zip does not go unnoticed.
          missing=0
          for arch in x86_64 arm64; do
            name="litert_prebuilts_windows_${arch}"
            zip_file="prebuilts/${name}.zip"
            if [[ ! -f "${zip_file}" ]]; then
              echo "Missing ${zip_file}"
              missing=1
              continue
            fi
            gcloud storage cp "${zip_file}" "gs://litert/binaries/nightly/${name}.zip"
            gcloud storage cp "${zip_file}" "gs://litert/binaries/nightly/archive/${name}_${NIGHTLY_DATE}.zip"
          done
          exit "${missing}"

  upload-to-pypi:
    name: "Upload Nightly Wheels to PyPI"
    runs-on: Windows_x64
    needs: [build-nightly, build-nightly-arm64]
    # Windows ARM64 wheels are uploaded when available but do not block the
    # x86_64 nightly upload.
    if: ${{ !cancelled() && needs.build-nightly.result == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install twine
        run: python -m pip install twine

      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ai-edge-litert-windows-*
          path: dist
          merge-multiple: true

      - name: List downloaded wheels
        run: dir dist

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_UPLOAD_TOKEN }}
        run: twine upload --skip-existing --non-interactive --verbose dist/*.whl
