# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#
# This workflow will run at the end of every day to
# 1. Run unit tests
# 2. Build Python Wheel Nightly Version, if the tests pass
# 3. Upload to PyPI

name: LiteRT Quantizer Build and Release (nightly)

on:
  workflow_dispatch:  # Allow manual triggers
  schedule:
    - cron: "0 0 * * *" # 12am UTC (5pm PST)

permissions:
  contents: read

jobs:
  run-unittests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    name: Run Unit Tests with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: litert_quantizer

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: litert_quantizer

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  build-and-release-nightly:
    needs: run-unittests
    # Only publish from main; runs on other branches stop after the tests.
    if: github.ref == 'refs/heads/main'
    name: Build and Release Python Wheel Nightly
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    defaults:
      run:
        working-directory: litert_quantizer

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: litert_quantizer

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python
        run: uv python install

      - name: Update Metadata for Nightly
        id: metadata
        run: |
          sed -i 's/name = "litert-quantizer"/name = "litert-quantizer-nightly"/' pyproject.toml
          grep -q 'name = "litert-quantizer-nightly"' pyproject.toml

          BASE_VERSION=$(cat VERSION | xargs)
          DATE=$(date +'%Y%m%d')
          echo "${BASE_VERSION}.dev${DATE}" > VERSION
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

          echo "Building litert-quantizer-nightly version $(cat VERSION)"

      - name: Build Nightly Package
        run: |
          uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_UPLOAD_TOKEN }}
        run: uv publish

  run-pip-install-and-import-test:
    needs: build-and-release-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    name: Test Install and Import litert-quantizer-nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Install litert-quantizer-nightly
        env:
          VERSION: ${{ needs.build-and-release-nightly.outputs.version }}
        run: |
          # A new release can take a few minutes to show up on PyPI.
          for attempt in 1 2 3 4 5; do
            python -m pip install "litert-quantizer-nightly==${VERSION}" && exit 0
            sleep 60
          done
          exit 1

      - name: Import litert-quantizer
        run: |
          python -c "import litert_quantizer"
          litert-quantizer --help
