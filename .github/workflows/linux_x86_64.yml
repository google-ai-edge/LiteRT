name: "linux_x86_64"
on:
  push:
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main

  workflow_dispatch:

permissions:
  contents: read # Required

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.0
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            src:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!g3doc/**'
              - '!site/**'
              - '!LICENSE'
      - name: Determine if build should run
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SRC_CHANGED: ${{ steps.filter.outputs.src }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || "${SRC_CHANGED}" == "true" ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

  presubmit:
    name: "Presubmit-Linux"
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:12822904942562e7deb0c91fb0eb3dd9ec87b4292881108b166e44149422b87d
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REFRESH_CACHE: ${{ github.event_name == 'schedule' ||
                         (github.event_name == 'workflow_dispatch' && inputs.REFRESH_CACHE) }}
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        # Install build toolchains and dependencies matching the internal CI image
        # (ci/tflite-py3.Dockerfile: libc++-18-dev, llvm-18, clang-18) to ensure environment consistency.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc++-18-dev libc++abi-18-dev llvm-18 clang-18 \
            libssl-dev build-essential libbz2-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libreadline-dev libsqlite3-dev liblzma-dev zlib1g-dev git curl

      - name: Setup Pyenv Python 3.11
        # Keep compiler and Python configuration consistent with internal CI
        # (run_bazel_test_with_docker.sh & tflite-py3.Dockerfile) to ensure Bazel remote cache hits.
        shell: bash
        run: |
          git clone https://github.com/pyenv/pyenv.git /pyenv
          export PYENV_ROOT=/pyenv
          export PATH="$PYENV_ROOT/shims:$PYENV_ROOT/bin:$PATH"
          pyenv install -s 3.11
          pyenv global 3.11
          echo "PYENV_ROOT=/pyenv" >> "$GITHUB_ENV"
          # In GHA, each echo to GITHUB_PATH prepends to PATH.
          # To achieve PATH=/pyenv/shims:/pyenv/bin:... matching internal CI:
          echo "/pyenv/bin" >> "$GITHUB_PATH"
          echo "/pyenv/shims" >> "$GITHUB_PATH"
          # Ensure HOME is /root so Bazelisk downloads to /root/.cache/bazelisk
          # matching internal CI container environment:
          echo "HOME=/root" >> "$GITHUB_ENV"
          echo "BAZELISK_HOME=/root/.cache/bazelisk" >> "$GITHUB_ENV"

      - name: Configure Bazel
        shell: bash
        run: |
          chmod +x configure.py
          sudo ln -sf "$(which python3)" /usr/local/bin/python3
          sudo mkdir -p /usr/local/lib/python3.11
          sudo ln -sfn "$(python3 -c 'import site; print(site.getsitepackages()[0])')" /usr/local/lib/python3.11/site-packages
          export PYTHON_BIN_PATH="/usr/local/bin/python3"
          export PYTHON_LIB_PATH="/usr/local/lib/python3.11/site-packages"
          export HERMETIC_PYTHON_VERSION=3.11
          export TF_NEED_ROCM=0
          export TF_NEED_CLANG=0
          export TF_NEED_CUDA=0
          export TF_SET_ANDROID_WORKSPACE=0
          export CC_OPT_FLAGS='-Wno-sign-compare'
          yes "" | python3 configure.py

      - name: Set up cache keys
        id: cache-keys
        run: |
          CACHE_RESTORE_KEY_2="$GITHUB_WORKFLOW"
          CACHE_RESTORE_KEY_1="$CACHE_RESTORE_KEY_2-${{ hashFiles('**/WORKSPACE', '**/.bazelrc') }}"
          CACHE_RESTORE_KEY_0="$CACHE_RESTORE_KEY_1-${{ hashFiles('**/BUILD*') }}"
          CACHE_RESTORE_KEY_HEAD="$CACHE_RESTORE_KEY_0-${{ github.event.pull_request.base.sha }}"
          CACHE_KEY="$CACHE_RESTORE_KEY_0-${{ github.sha }}"
          echo "CACHE_RESTORE_KEY_2=$CACHE_RESTORE_KEY_2" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=$CACHE_RESTORE_KEY_1" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=$CACHE_RESTORE_KEY_0" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_HEAD=$CACHE_RESTORE_KEY_HEAD" >> "$GITHUB_OUTPUT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Clean build outputs if cache is being refreshed.
        if: env.REFRESH_CACHE == 'true'
        run: bazel clean --expunge

      - name: Restore bazel cache if cache is not being refreshed.
        id: bazel-cache
        if: env.REFRESH_CACHE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/bazel-linux
            ~/.cache/bazel-android
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_HEAD }}
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_0 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_1 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_2 }}-

      - name: Check cache hit
        env:
          CACHE_HIT: ${{ steps.bazel-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.bazel-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}
        run: |
          echo "Cache Hit: $CACHE_HIT"
          echo "Cache Primary Key: $CACHE_PRIMARY_KEY"
          echo "Cache Matched Key: $CACHE_MATCHED_KEY"

      - name: Run bazel build on Linux
        env:
          TEST_LANG_FILTERS: cc,py
        shell: bash
        run: |
          BUILD_FLAGS=(
            "--config=public_cache"
            "--config=bulk_test_cpu"
            "--test_lang_filters=${TEST_LANG_FILTERS}"
            "--test_output=errors"
            "--keep_going"
            "--repo_env=USE_PYWRAP_RULES=True"
            "--repo_env=HERMETIC_PYTHON_VERSION=3.11"
          )

          LITERT_EXCLUDED_TARGETS=(
            "-//litert/c:litert_compiled_model_shared_lib_test"
            "-//litert/c:litert_compiled_model_test"
            "-//litert/cc:litert_compiled_model_test"
            "-//litert/cc:litert_environment_test"
            "-//litert/python/tools/model_utils/test/..."
            "-//litert/runtime:compiled_model_test"
            "-//litert/runtime/accelerators/gpu/..."
            "-//litert/tools:tool_display_test"
            "-//litert/tools:dump_test"
            "-//litert/tools:apply_plugin_test"
            "-//litert/vendors/intel_openvino/compiler:decoder_test"
            "-//litert/vendors/intel_openvino/dispatch:dispatch_api_openvino_test"
            "-//litert/vendors/intel_openvino/compiler:openvino_compiler_plugin_test"
          )

          bazel test "${BUILD_FLAGS[@]}" -- //tensor/... //litert/... //weight_loader/... "${LITERT_EXCLUDED_TARGETS[@]}"

      - name: Build Intel OpenVINO plugin for Linux
        run: |
          bazel build \
            --config=public_cache \
            --repo_env=USE_PYWRAP_RULES=True \
            --repo_env=HERMETIC_PYTHON_VERSION=3.11 \
            //litert/vendors/intel_openvino/compiler:libLiteRtCompilerPlugin_IntelOpenvino.so \
            //litert/vendors/intel_openvino/dispatch:libLiteRtDispatch_IntelOpenvino.so

      - name: Remove cache if cache is being refreshed.
        if: env.REFRESH_CACHE == 'true'
        continue-on-error: true
        env:
          CACHE_KEY: ${{ steps.cache-keys.outputs.CACHE_KEY }}
        run: gh cache delete $CACHE_KEY

      - name: Save bazel cache if it's new or being refreshed.
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.REFRESH_CACHE == 'true' || steps.bazel-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/bazel-linux
            ~/.cache/bazel-android
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
