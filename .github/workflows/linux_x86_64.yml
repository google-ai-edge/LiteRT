name: "linux_x86_64"
on:
  push:
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.0
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            src:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!g3doc/**'
              - '!site/**'
              - '!LICENSE'
      - name: Determine if build should run
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SRC_CHANGED: ${{ steps.filter.outputs.src }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || "${SRC_CHANGED}" == "true" ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

  presubmit:
    name: "Presubmit-Linux"
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:d6b429665f5269698f88ccd00bcb8a6eb685332c302f08f29fe0738cd6a6610c
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libc++-18-dev libc++abi-18-dev llvm-18 clang-18

      - name: Configure tensorflow & python path
        run: |
          chmod +x configure.py
          export PYTHON_BIN_PATH=$(which python3)
          export PYTHON_LIB_PATH=$(python3 -c 'import site; print(site.getsitepackages()[0])')
          export TF_NEED_ROCM=0
          export TF_NEED_CUDA=0
          export TF_SET_ANDROID_WORKSPACE=0
          export CC_OPT_FLAGS='-Wno-sign-compare'
          yes "" | python3 configure.py

      - name: Run bazel build on Linux
        env:
          TEST_LANG_FILTERS: cc,py
        shell: bash
        run: |
          BUILD_FLAGS=(
            "--config=public_cache"
            "--config=bulk_test_cpu"
            "--test_lang_filters=${TEST_LANG_FILTERS}"
            "--test_output=errors"
            "--keep_going"
            "--repo_env=USE_PYWRAP_RULES=True"
          )

          LITERT_EXCLUDED_TARGETS=(
            "-//litert/c:litert_compiled_model_shared_lib_test"
            "-//litert/c:litert_compiled_model_test"
            "-//litert/cc:litert_compiled_model_test"
            "-//litert/cc:litert_environment_test"
            "-//litert/python/tools/model_utils/test/..."
            "-//litert/runtime:compiled_model_test"
            "-//litert/runtime/accelerators/gpu/..."
            "-//litert/tools:tool_display_test"
            "-//litert/tools:dump_test"
            "-//litert/tools:apply_plugin_test"
            "-//litert/vendors/intel_openvino/compiler:decoder_test"
            "-//litert/vendors/intel_openvino/dispatch:dispatch_api_openvino_test"
            "-//litert/vendors/intel_openvino/compiler:openvino_compiler_plugin_test"
          )

          bazel test "${BUILD_FLAGS[@]}" -- //tensor/... //litert/... //weight_loader/... "${LITERT_EXCLUDED_TARGETS[@]}"

      - name: Build Intel OpenVINO plugin for Linux
        run: |
          bazel build --config=public_cache \
            //litert/vendors/intel_openvino/compiler:libLiteRtCompilerPlugin_IntelOpenvino.so \
            //litert/vendors/intel_openvino/dispatch:libLiteRtDispatch_IntelOpenvino.so
