name: "bazel-windows-arm64"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 11 * * *"  # Run at 3am PST (11am UTC) every day to refresh the cache.
  workflow_dispatch:
    inputs:
      REFRESH_CACHE:
        description: 'Refresh cache to remove unused files'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.0
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            src:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!g3doc/**'
              - '!site/**'
              - '!LICENSE'
              - '!litert/objc/**'
              - '!litert/swift/**'
              - '!litert_quantizer/**'
      - name: Determine if build should run
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SRC_CHANGED: ${{ steps.filter.outputs.src }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || "${SRC_CHANGED}" == "true" ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

  # Cross-compiles LiteRT for Windows ARM64 with Bazel + MSVC on the x86_64
  # runner: the prebuilt binaries (libLiteRt.dll, GPU accelerator, Qualcomm
  # plugins, tools) and the ai-edge-litert wheel. This is the same build the
  # Windows ARM64 release jobs run (ci/build_pip_package_with_bazel_windows.ps1).
  presubmit:
    name: "Presubmit-Bazel-Windows-ARM64"
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: windows-x86-n2-16
    timeout-minutes: 300
    env:
      # Clear ANDROID_NDK_HOME as windows-latest has NDK where jobs don't have permission for
      # androidndk rulesto create symlinks.
      ANDROID_NDK_HOME:
      LITERT_MODELS: ""
      GH_TOKEN: ${{ github.token }}
      PYTHON_VERSION: "3.12"
      REFRESH_CACHE: ${{ github.event_name == 'schedule' ||
                         (github.event_name == 'workflow_dispatch' && inputs.REFRESH_CACHE) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add GNU tar to PATH
        shell: bash
        run: echo "C:/Program Files/Git/usr/bin" >> $GITHUB_PATH

      - name: Mount Bazel
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install python-build and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel

      - name: Set up Windows ARM64 cross-compilation toolchain
        run: |
          .\ci\setup_windows_arm64_toolchain.ps1

      - name: Set USE_BAZEL_VERSION
        run: |
          if (Test-Path .bazelversion) {
            $version = Get-Content .bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          } elseif (Test-Path bazelversion) {
            $version = Get-Content bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          }

      - name: Configure tensorflow & python path
        run: |
          $env:PYTHON_BIN_PATH = (Get-Command python).Source
          $env:PYTHON_LIB_PATH = (python -c 'import site; print(site.getsitepackages()[0])')
          $env:TF_NEED_CLANG = 0
          $env:TF_NEED_ROCM = 0
          $env:TF_NEED_CUDA = 0
          $env:TF_SET_ANDROID_WORKSPACE = 0
          $env:CC_OPT_FLAGS = '-Wno-sign-compare'
          echo "HERMETIC_PYTHON_VERSION=$env:PYTHON_VERSION" >> $env:GITHUB_ENV
          python configure.py

      - name : Set up cache keys and bazel output base.
        id: cache-keys
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          $CACHE_RESTORE_KEY_2="$env:WORKFLOW_NAME-$env:PYTHON_VERSION"
          $CACHE_RESTORE_KEY_1="$CACHE_RESTORE_KEY_2-${{ hashFiles('**/WORKSPACE', '**/.bazelrc') }}"
          $CACHE_RESTORE_KEY_0="$CACHE_RESTORE_KEY_1-${{ hashFiles('**/BUILD*') }}"
          # If it's not a pull request, then it will be the same as $CACHE_RESTORE_KEY_1-.
          $CACHE_RESTORE_KEY_HEAD="$CACHE_RESTORE_KEY_0-${{ github.event.pull_request.base.sha }}"
          $CACHE_KEY="$CACHE_RESTORE_KEY_0-${{ github.sha }}"
          echo "CACHE_RESTORE_KEY_2=$CACHE_RESTORE_KEY_2" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=$CACHE_RESTORE_KEY_1" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=$CACHE_RESTORE_KEY_0" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_HEAD=$CACHE_RESTORE_KEY_HEAD" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$env:GITHUB_OUTPUT"
          # D: is faster than C: for I/O, but self-hosted runners only have C:.
          echo "BAZEL_OUTPUT_USER_ROOT=C:/.cache/bazel-arm64" >> "$env:GITHUB_ENV"

      - name: Clean build outputs if cache is being refreshed.
        if: env.REFRESH_CACHE == 'true'
        run: bazel clean --expunge --output_user_root="$env:BAZEL_OUTPUT_USER_ROOT"

      - name: Restore bazel cache if cache is not being refreshed.
        id: bazel-cache
        if: env.REFRESH_CACHE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        env:
          windir: ""
          PATH: "C:/Program Files/Git/usr/bin;C:/Windows/System32;C:/Windows"
        with:
          path: ~/.cache/bazel-windows-arm64
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_HEAD }}
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_0 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_1 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_2 }}-

      - name: Set BAZEL_CONFIG_FLAGS for Cache
        run: |
          $CacheDir = Join-Path $env:USERPROFILE (Join-Path ".cache" "bazel-windows-arm64")
          echo "BAZEL_CONFIG_FLAGS=--disk_cache=$CacheDir" >> $env:GITHUB_ENV

      - name: Build Windows ARM64 prebuilt binaries
        run: |
          .\ci\build_pip_package_with_bazel_windows.ps1 -TargetArch arm64 -Mode prebuilts

      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: litert-prebuilts-windows-arm64
          path: dist/litert_prebuilts_windows_arm64.zip

      - name: Build Windows ARM64 wheel
        run: |
          .\ci\build_pip_package_with_bazel_windows.ps1 -TargetArch arm64 -Mode wheel

      - name: Verify the distribution
        run: twine check --strict dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: ai-edge-litert-presubmit-windows-arm64-${{ env.PYTHON_VERSION }}
          path: dist/*.whl

      - name: Shutdown bazel server before saving cache.
        if: always()
        run: bazel --output_user_root="$env:BAZEL_OUTPUT_USER_ROOT" shutdown

      - name: Save bazel cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        if: always() && github.event_name != 'pull_request'
        env:
          windir: ""
          PATH: "C:/Program Files/Git/usr/bin;C:/Windows/System32;C:/Windows"
        with:
          path: ~/.cache/bazel-windows-arm64
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}

  # A PR is accepted only if this check concludes "success" ("skipped" doesn't
  # count). So this job always runs, and passes if Presubmit-Bazel-Windows-ARM64
  # passed or was skipped because the PR has no relevant changes. This check is
  # required by name, so keep the name unique across workflows.
  gate:
    name: "Presubmit-Bazel-Windows-ARM64-Gate"
    needs: [check, presubmit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RUN_BUILD: ${{ needs.check.outputs.run_build }}
          BUILD_RESULT: ${{ needs.presubmit.result }}
        run: |
          echo "check=${CHECK_RESULT} run_build=${RUN_BUILD} build=${BUILD_RESULT}"
          if [[ "${CHECK_RESULT}" == "success" ]]; then
            if [[ "${BUILD_RESULT}" == "success" ]]; then
              exit 0
            fi
            if [[ "${BUILD_RESULT}" == "skipped" && "${RUN_BUILD}" == "false" ]]; then
              exit 0
            fi
          fi
          exit 1
