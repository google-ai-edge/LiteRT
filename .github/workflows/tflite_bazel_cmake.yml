name: "TFLite Bazel and CMake"

on:
  push:
    branches:
      - main
      - test-remote-cache-fix
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.0
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            src:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!g3doc/**'
              - '!site/**'
              - '!LICENSE'
      - name: Determine if build should run
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SRC_CHANGED: ${{ steps.filter.outputs.src }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || "${SRC_CHANGED}" == "true" ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

  tflite-build:
    name: "Presubmit-TFLite-Bazel-CMake"
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:d6b429665f5269698f88ccd00bcb8a6eb685332c302f08f29fe0738cd6a6610c
    env:
      CMAKE_BUILD_DIR: cmake_build_tflite
      CMAKE_BUILD_PARALLEL_LEVEL: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install System Dependencies, CMake, and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libc++-18-dev libc++abi-18-dev llvm-18 clang-18 \
            libssl-dev build-essential libbz2-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libreadline-dev libsqlite3-dev liblzma-dev zlib1g-dev git curl
          python3.11 -m pip install cmake==3.28.3
          cmake --version
          ninja --version

      - name: Setup Pyenv Python 3.11
        # LINT.IfChange(configure_tflite_build_flags)
        # Keep compiler and Python configuration consistent with internal CI
        # (run_bazel_test_with_docker.sh & tflite-py3.Dockerfile) to ensure Bazel remote cache hits.
        shell: bash
        run: |
          git clone https://github.com/pyenv/pyenv.git /pyenv
          export PYENV_ROOT=/pyenv
          export PATH="$PYENV_ROOT/shims:$PYENV_ROOT/bin:$PATH"
          pyenv install -s 3.11
          pyenv global 3.11
          echo "PYENV_ROOT=/pyenv" >> "$GITHUB_ENV"
          echo "/pyenv/shims" >> "$GITHUB_PATH"
          echo "/pyenv/bin" >> "$GITHUB_PATH"

      - name: Configure Bazel
        shell: bash
        run: |
          chmod +x configure.py
          sudo ln -sf "$(which python3)" /usr/local/bin/python3
          sudo mkdir -p /usr/local/lib/python3.11
          sudo ln -sfn "$(python3 -c 'import site; print(site.getsitepackages()[0])')" /usr/local/lib/python3.11/site-packages
          export PYTHON_BIN_PATH="/usr/local/bin/python3"
          export PYTHON_LIB_PATH="/usr/local/lib/python3.11/site-packages"
          export HERMETIC_PYTHON_VERSION=3.11
          export TF_NEED_ROCM=0
          export TF_NEED_CLANG=0
          export TF_NEED_CUDA=0
          export TF_SET_ANDROID_WORKSPACE=0
          export CC_OPT_FLAGS='-Wno-sign-compare'
          python3 configure.py < <(yes "")
        # LINT.ThenChange(../ci/run_bazel_test_with_docker.sh:configure_tflite_build_flags)

      - name: Build TFLite Linux artifacts with Bazel
        # LINT.IfChange(tflite_bazel_targets)
        shell: bash
        run: |
          bazel build \
            --config=public_cache \
            --config=bulk_build_cpu \
            --repo_env=USE_PYWRAP_RULES=True \
            --repo_env=HERMETIC_PYTHON_VERSION=3.11 \
            --execution_log_json_file=/tmp/gha_exec.json \
            -- \
            //tflite/converter:flatbuffer_translate || true

          python3 -c "
          import json
          with open('/tmp/gha_exec.json', 'r') as f:
              for i, line in enumerate(f):
                  if 'command_line_flags.cc' in line and 'commandArgs' in line:
                      print(f'GHA command_line_flags line: {i+1}')
                      break
          "
          python3 -c "
          with open('/tmp/gha_exec.json', 'r') as f:
              for line in f:
                  if 'command_line_flags.cc' in line and 'commandArgs' in line:
                      print('=== GHA command_line_flags action ===')
                      print(line[:500])
                      for _ in range(100):
                          l = next(f)
                          print(l, end='')
                          if '\"platform\"' in l:
                              break
                      break
          "
          python3 -c "
          with open('/tmp/gha_exec.json', 'r') as f:
              for line in f:
                  if 'command_line_flags.cc' in line and 'commandArgs' in line:
                      for l in f:
                          if '\"runner\":' in l or '\"cacheHit\":' in l or '\"targetLabel\":' in l or '\"digest\":' in l:
                              print(l, end='')
                              if '\"digest\":' in l:
                                  for _ in range(6):
                                      print(next(f), end='')
                                  break
                      break
          "
          rm -f /tmp/gha_exec.json
        # LINT.ThenChange(../ci/run_bazel_test.sh:tflite_bazel_targets)

      - name: Configure TFLite with CMake
        run: |
          cmake \
            -S tflite \
            -B "${CMAKE_BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build TFLite runtime with CMake
        # TODO: Build all targets under tflite with cmake
        run: cmake --build "${CMAKE_BUILD_DIR}" --target tensorflow-lite --parallel
