name: "cmake-iot-linux"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.0
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            src:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!g3doc/**'
              - '!site/**'
              - '!LICENSE'
              - '!litert_quantizer/**'
      - name: Determine if build should run
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SRC_CHANGED: ${{ steps.filter.outputs.src }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || "${SRC_CHANGED}" == "true" ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

  presubmit:
    name: "Presubmit-IoT-Linux"
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: linux-x86-n4-16
    timeout-minutes: 120
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/litert-docker-container/litert-iot-linux@sha256:2339b0db7f10ee641a1752a48c7a22a44bbd25bc5c7aaefd91d57ecf15fee0e2
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 6
      LINUX_AARCH64_ESDK: /opt/toolchains/qcom-esdk-gcc11.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Build Linux IoT artifacts
        run: RUN_DIRECTLY=true JOBS=6 OUTPUT_DIR=/tmp/litert_binaries ./ci/build_iot_linux_with_docker.sh

  # A PR is accepted only if this check concludes "success" ("skipped" doesn't
  # count). So this job always runs, and passes if Presubmit-IoT-Linux
  # passed or was skipped because the PR has no relevant changes. This check is
  # required by name, so keep the name unique across workflows.
  gate:
    name: "Presubmit-IoT-Linux-Gate"
    needs: [check, presubmit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RUN_BUILD: ${{ needs.check.outputs.run_build }}
          BUILD_RESULT: ${{ needs.presubmit.result }}
        run: |
          echo "check=${CHECK_RESULT} run_build=${RUN_BUILD} build=${BUILD_RESULT}"
          if [[ "${CHECK_RESULT}" == "success" ]]; then
            if [[ "${BUILD_RESULT}" == "success" ]]; then
              exit 0
            fi
            if [[ "${BUILD_RESULT}" == "skipped" && "${RUN_BUILD}" == "false" ]]; then
              exit 0
            fi
          fi
          exit 1
