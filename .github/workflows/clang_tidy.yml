name: "clang-tidy"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'litert/**/*.c'
      - 'litert/**/*.cc'
      - 'litert/**/*.cpp'
      - 'litert/**/*.cxx'
      - 'litert/**/*.h'
      - 'litert/**/*.inc'
      - '.github/workflows/clang_tidy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: "clang-tidy"
    # Use GitHub-hosted runner to avoid consuming self-hosted linux-x86-n4-16
    # runner pool capacity, since clang-tidy only inspects changed PR files.
    runs-on: ubuntu-latest
    env:
      CLANG_TIDY_CHECKS: "clang-diagnostic-*,clang-analyzer-*"
      CMAKE_BUILD_DIR: "litert/cmake_build_clang_tidy"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install clang-tidy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            clang-tidy-18 \
            libc++-18-dev \
            libc++abi-18-dev
          cmake --version
          clang-tidy-18 --version

      - name: Configure CMake compile database
        run: |
          cmake -S litert -B "${CMAKE_BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLITERT_BUILD_TESTS=OFF \
            -DLITERT_ENABLE_GPU=OFF \
            -DLITERT_ENABLE_NPU=OFF
          test -f "${CMAKE_BUILD_DIR}/compile_commands.json"

      # clang-tidy only consumes compile_commands.json and never runs the
      # build, so headers produced by build-time custom commands (e.g. the
      # flatc-generated tflite/schema/mutable/schema_generated.h used by
      # tensor/backends/tflite) would otherwise be missing and surface as
      # clang-diagnostic-error "file not found" in every translation unit
      # that transitively includes them.
      - name: Generate FlatBuffers schema headers
        run: |
          cmake --build "${CMAKE_BUILD_DIR}" --target tflite_mutable_schema_gen
          test -f "${CMAKE_BUILD_DIR}/core/model/generated/include/tflite/schema/mutable/schema_generated.h"

      - name: Select files for clang-tidy
        id: select-files
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = Path.cwd().resolve()
          build_dir = repo / os.environ["CMAKE_BUILD_DIR"]
          compile_db = json.loads((build_dir / "compile_commands.json").read_text())

          compilable = set()
          for entry in compile_db:
            source = Path(entry["file"])
            if not source.is_absolute():
              source = (Path(entry.get("directory", ".")) / source).resolve()
            else:
              source = source.resolve()
            try:
              compilable.add(source.relative_to(repo).as_posix())
            except ValueError:
              pass

          source_suffixes = {".c", ".cc", ".cpp", ".cxx"}
          header_suffixes = {".h", ".inc"}
          all_suffixes = source_suffixes | header_suffixes
          changed = []
          # Added or modified line ranges of each changed C/C++ file in the PR.
          line_ranges = {}
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "pull_request":
            subprocess.run(
                ["git", "config", "--global", "--add", "safe.directory", str(repo)],
                check=True,
            )
            # The checkout is the PR merged into main, and HEAD^1 is main, so
            # this diff is exactly the PR's changes, with line numbers that
            # match the checked-out files.
            diff = subprocess.check_output(
                [
                    "git",
                    "diff",
                    "--unified=0",
                    "--no-color",
                    "--diff-filter=ACMRT",
                    "HEAD^1",
                    "HEAD",
                ],
                text=True,
            )
            path = None
            in_header = False
            for line in diff.splitlines():
              if line.startswith("diff --git "):
                path = None
                in_header = True
              elif in_header and line.startswith("+++ "):
                # Only the first "+++ " line after "diff --git" names the file;
                # later ones are added lines that start with "++".
                in_header = False
                path = line[6:] if line.startswith("+++ b/") else None
                if path and Path(path).suffix not in all_suffixes:
                  path = None
              elif path and line.startswith("@@"):
                match = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", line)
                if match:
                  start = int(match.group(1))
                  count = int(match.group(2) or 1)
                  if count > 0:
                    line_ranges.setdefault(path, []).append(
                        [start, start + count - 1])
            # Only check files with added or modified lines; files that only
            # lose lines have nothing to report.
            changed = list(line_ranges)
          else:
            print(f"No pull request file list for {event_name}; running smoke source only.")

          selected = []
          missing = []
          # Changed files that clang-tidy checks, directly or through the
          # translation units that include them.
          checked = []
          for source in changed:
            if not source.startswith("litert/"):
              continue
            if "schema" in Path(source).parts:
              continue
            if source in compilable:
              selected.append(source)
              checked.append(source)
            elif Path(source).suffix in header_suffixes:
              # For headers and .inc files, find compilable translation units that include them.
              including_sources = []
              for comp_path in compilable:
                full_comp_path = repo / comp_path
                if not full_comp_path.is_file():
                  continue
                try:
                  content = full_comp_path.read_text(errors="ignore")
                except Exception:
                  continue
                if source in content:
                  including_sources.append(comp_path)
                  if len(including_sources) >= 3:
                    break
              if including_sources:
                print(f"Found translation units including {source}: {including_sources}")
                selected.extend(including_sources)
                checked.append(source)
              else:
                missing.append(source)
            else:
              missing.append(source)

          selected = list(dict.fromkeys(selected))

          smoke_source = "litert/c/empty.cc"
          if smoke_source in compilable and smoke_source not in selected:
            selected.append(smoke_source)

          if missing:
            print("Notice: The following changed C/C++ sources are missing from the CMake compile database and will be skipped:")
            for source in missing:
              print(f"  {source}")

          if not selected:
            print("No C/C++ source files selected for clang-tidy.")
            raise SystemExit(1)

          Path("/tmp/clang_tidy_files.txt").write_text("\n".join(selected) + "\n")
          print("Selected clang-tidy files:")
          for source in selected:
            print(f"  {source}")

          # Only report diagnostics on lines the PR adds or modifies in the
          # checked files, so that pre-existing findings in main do not block
          # unrelated PRs. Limitations: clang-analyzer checks are
          # path-sensitive, so a bug caused by a changed line (e.g. a removed
          # null check) but reported at an unchanged line is suppressed, and
          # deletion-only changes are not checked. No filter is needed when only
          # the (empty) smoke source is checked.
          line_filter = [
              {"name": path, "lines": line_ranges[path]} for path in checked
          ]
          if line_filter:
            line_filter_json = json.dumps(line_filter, separators=(",", ":"))
            Path("/tmp/clang_tidy_line_filter.json").write_text(line_filter_json)
            print(f"clang-tidy line filter: {line_filter_json}")
          PY

      - name: Run clang-tidy
        run: |
          line_filter_args=()
          if [[ -s /tmp/clang_tidy_line_filter.json ]]; then
            line_filter_args=(--line-filter="$(cat /tmp/clang_tidy_line_filter.json)")
          fi
          xargs \
            clang-tidy-18 \
            -p "${CMAKE_BUILD_DIR}" \
            --checks="${CLANG_TIDY_CHECKS}" \
            --header-filter='.*litert/[^.].*' \
            "${line_filter_args[@]}" \
            < /tmp/clang_tidy_files.txt
