name: "windows_wheel_release"
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'When true, wheels will not be published to PyPI.'
        required: true
        default: true
        type: boolean
      ref:
        description: 'The commit, tag or branch to run the workflow on. If empty, run on the latest commit.'
        required: false
        default: ''
        type: string

permissions:
  contents: read # Required

jobs:
  build-release:
    name: "Build stable Windows wheel - Python ${{ matrix.python-version }}"
    runs-on: windows-x86-n2-16 # zizmor: ignore[self-hosted-runner]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Clear ANDROID_NDK_HOME as windows-latest has NDK where jobs don't have permission for
      # androidndk rulesto create symlinks.
      ANDROID_NDK_HOME:
      LITERT_MODELS: ""
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # If inputs.ref is empty, checkout the latest commit on the default branch.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Add GNU tar to PATH
        shell: bash
        run: echo "C:/Program Files/Git/usr/bin" >> $GITHUB_PATH

      - name: Mount Bazel
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3 # zizmor: ignore[unverified-uses,stale-action-refs]

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python-build and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel
          python -m pip list

      - name: Set USE_BAZEL_VERSION
        run: |
          if (Test-Path .bazelversion) {
            $version = Get-Content .bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          } elseif (Test-Path bazelversion) {
            $version = Get-Content bazelversion -TotalCount 1
            echo "USE_BAZEL_VERSION=$version" >> $env:GITHUB_ENV
          }

      - name: Configure tensorflow & python path
        run: |
          $env:PYTHON_BIN_PATH = (Get-Command python).Source
          $env:PYTHON_LIB_PATH = (python -c 'import site; print(site.getsitepackages()[0])')
          $env:TF_NEED_ROCM = 0
          $env:TF_NEED_CUDA = 0
          $env:TF_SET_ANDROID_WORKSPACE = 0
          $env:CC_OPT_FLAGS = '/arch:AVX'
          echo "HERMETIC_PYTHON_VERSION=${{ matrix.python-version }}" >> $env:GITHUB_ENV
          python configure.py

      - name : Set up cache keys and bazel output base.
        id: cache-keys
        run: |
          $CACHE_RESTORE_KEY_2="$env:GITHUB_WORKFLOW-${{ matrix.python-version }}"
          $CACHE_RESTORE_KEY_1="$CACHE_RESTORE_KEY_2-${{ hashFiles('**/WORKSPACE', '**/.bazelrc') }}"
          $CACHE_RESTORE_KEY_0="$CACHE_RESTORE_KEY_1-${{ hashFiles('**/BUILD*') }}"
          # If it's not a pull request, then it will be the same as $CACHE_RESTORE_KEY_1-.
          $CACHE_RESTORE_KEY_HEAD="$CACHE_RESTORE_KEY_0-${{ github.event.pull_request.base.sha }}"
          $CACHE_KEY="$CACHE_RESTORE_KEY_0-${{ github.sha }}"
          echo "CACHE_RESTORE_KEY_2=$CACHE_RESTORE_KEY_2" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=$CACHE_RESTORE_KEY_1" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=$CACHE_RESTORE_KEY_0" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_HEAD=$CACHE_RESTORE_KEY_HEAD" >> "$env:GITHUB_OUTPUT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$env:GITHUB_OUTPUT"
          # D: is faster than C: for I/O, but self-hosted runners only have C:.
          echo "BAZEL_OUTPUT_USER_ROOT=C:/.cache/bazel" >> "$env:GITHUB_ENV"

      - name: Clean build outputs if cache is being refreshed.
        if: env.REFRESH_CACHE == 'true'
        run: bazel clean --expunge --output_user_root="$env:BAZEL_OUTPUT_USER_ROOT"

      - name: Restore bazel cache if cache is not being refreshed.
        id: bazel-cache
        if: env.REFRESH_CACHE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          windir: ""
          PATH: "C:/Program Files/Git/usr/bin;C:/Windows/System32;C:/Windows"
        with:
          path: ~/.cache/bazel-windows
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_HEAD }}
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_0 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_1 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_2 }}-

      - name: Check cache hit
        run: |
          echo "Cache Hit: $env:STEPS_BAZEL_CACHE_OUTPUTS_CACHE_HIT"
          echo "Cache Primary Key: $env:STEPS_BAZEL_CACHE_OUTPUTS_CACHE_PRIMARY_KEY"
          echo "Cache Matched Key: $env:STEPS_BAZEL_CACHE_OUTPUTS_CACHE_MATCHED_KEY"
        env:
          STEPS_BAZEL_CACHE_OUTPUTS_CACHE_HIT: ${{ steps.bazel-cache.outputs.cache-hit }}
          STEPS_BAZEL_CACHE_OUTPUTS_CACHE_PRIMARY_KEY: ${{ steps.bazel-cache.outputs.cache-primary-key }}
          STEPS_BAZEL_CACHE_OUTPUTS_CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}

      - name: Set BAZEL_CONFIG_FLAGS for Cache
        run: |
          $CacheDir = Join-Path $env:USERPROFILE (Join-Path ".cache" "bazel-windows")
          echo "BAZEL_CONFIG_FLAGS=--disk_cache=$CacheDir" >> $env:GITHUB_ENV

      - name: Build LiteRT wheel for Windows
        run: |
          .\ci\build_pip_package_with_bazel_windows.ps1

      - name: Verify the distribution
        run: twine check --strict dist/*

      - name: List the contents of ai-edge-litert wheel
        run: Get-ChildItem dist -Filter *.whl | ForEach-Object { python -m zipfile --list $_.FullName }

      - name: Install local wheel
        run: Get-ChildItem dist -Filter *.whl | ForEach-Object { python -m pip install $_.FullName }

      - name: Import ai_edge_litert
        run: |
          python -c "import ai_edge_litert"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-edge-litert-windows-${{ matrix.python-version }}
          path: dist/*.whl

      - name: Shutdown bazel server before saving cache.
        if: always()
        run: bazel --output_user_root="$env:BAZEL_OUTPUT_USER_ROOT" shutdown

      - name: Save bazel cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        env:
          windir: ""
          PATH: "C:/Program Files/Git/usr/bin;C:/Windows/System32;C:/Windows"
        with:
          path: ~/.cache/bazel-windows
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}

  upload-to-pypi:
    name: "Upload stable Wheels to PyPI"
    runs-on: Windows_x64 # zizmor: ignore[self-hosted-runner]
    needs: build-release
    if: success() && inputs.dry_run == false
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install twine
        run: python -m pip install twine

      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ai-edge-litert-windows-*
          path: dist
          merge-multiple: true

      - name: List downloaded wheels
        run: dir dist

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: # zizmor: ignore[secrets-outside-env] ${{ secrets.PYPI_UPLOAD_TOKEN }}
        # zizmor: ignore[use-trusted-publishing]
        run: twine upload --skip-existing --non-interactive --verbose dist/*.whl
