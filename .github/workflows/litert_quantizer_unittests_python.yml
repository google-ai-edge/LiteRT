# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#
# This workflow will run nightly or when triggered from PR comment

name: LiteRT Quantizer Unit Tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "litert_quantizer/**"
      - ".github/workflows/litert_quantizer_unittests_python.yml"
  push:
    branches: ["main"]
    paths:
      - "litert_quantizer/**"
      - ".github/workflows/litert_quantizer_unittests_python.yml"
  workflow_dispatch:  # Allow manual triggers
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    name: "Run Unit Tests with Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    defaults:
      run:
        working-directory: litert_quantizer

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        sparse-checkout: litert_quantizer

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Run tests
      shell: bash
      run: |
        uv run \
          --python ${{ matrix.python-version }} \
          pytest
